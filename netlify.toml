[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  # Native Functions V2 use NFT to trace the preserved CommonJS server.
  node_bundler = "nft"
  included_files = [
    ".netlify/server-dist/**",
    "node_modules/@libsql/linux-*-gnu/**",
    "node_modules/@img/sharp-linux-*/**",
    "node_modules/@img/sharp-libvips-linux-*/**",
    # Never package local editorial data or credentials traced from defaults.
    "!data/**",
    "!data-restored*/**",
    "!backups/**",
    "!.env",
    "!.env.*",
    "!artifacts/**",
    "!tests/**",
    "!playwright-report/**",
    "!test-results/**",
    "!.git/**",
    "!dist/**",
    "!node_modules/@libsql/darwin*/**",
    "!node_modules/@img/*darwin*/**"
  ]

# The institutional page and bundles are served directly from the CDN.
# The CMS function declares its API, blog, discovery and media routes.
# Do not add a catch-all rewrite: unknown pages must keep their real 404 status.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
