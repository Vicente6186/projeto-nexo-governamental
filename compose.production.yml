name: nexo-governamental

services:
  nexo:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexo-governamental:production
    user: "1000:1000"
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.production
        required: true
    environment:
      NODE_ENV: production
      CMS_LOCAL_PREVIEW: "0"
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${NEXO_HTTP_PORT:-3001}:3001"
    volumes:
      - nexo-data:/app/data
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nexo-data:
